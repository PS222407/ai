<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background: #f4f4f4;
        }
    </style>
</head>

<body>

<h2>📰 Fake News Detector</h2>

<textarea id="textInput" placeholder="Paste news text here..."></textarea>

<br>

<button onclick="submitText()">Predict</button>

<div class="result" id="resultBox"></div>

<script>
async function submitText() {
    const text = document.getElementById("textInput").value;

    const resultBox = document.getElementById("resultBox");
    resultBox.innerHTML = "Loading...";

    try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        resultBox.innerHTML = `
            <strong>Prediction:</strong> ${data.prediction} <br>
            <strong>Confidence:</strong> ${data.confidence.toFixed(4)}
        `;

    } catch (error) {
        resultBox.innerHTML = "Error calling API.";
        console.error(error);
    }
}
</script>

</body>
</html>
